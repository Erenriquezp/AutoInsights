# Local stack: MongoDB, a Spark cluster (1 master + 2 workers), the API and the dashboard.
#
#   docker compose up -d --build                  # development (Vite dev server on :5173)
#   docker compose --profile prod up -d --build   # adds the production build on :4173
#   docker compose run --rm spark-tests           # ETL tests inside the Spark image
#
# Ports are bound to 127.0.0.1 so nothing is exposed to the local network.
# Optional overrides go in .env (see .env.example).

services:
  # ---------------------------------------------------------------- data
  mongodb:
    image: mongo:6.0
    container_name: autoinsights_mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bigdata_net

  # ---------------------------------------------------------------- processing
  spark-master:
    build:
      context: ./backend/spark
      target: runtime
    container_name: spark-master
    ports:
      - "127.0.0.1:8080:8080" # master web UI
      - "127.0.0.1:7077:7077" # cluster port
    volumes:
      - ./backend/data:/opt/spark/data
      - ./backend/spark/jobs:/app # ETL code: etl_job.py, transforms.py, normalize.py
    networks:
      - bigdata_net
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker-1:
    build:
      context: ./backend/spark
      target: runtime
    container_name: spark-worker-1
    environment:
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./backend/data:/opt/spark/data
    depends_on:
      - spark-master
    networks:
      - bigdata_net
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  spark-worker-2:
    build:
      context: ./backend/spark
      target: runtime
    container_name: spark-worker-2
    environment:
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    ports:
      - "127.0.0.1:8082:8081"
    volumes:
      - ./backend/data:/opt/spark/data
    depends_on:
      - spark-master
    networks:
      - bigdata_net
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  # ETL tests on the same Spark and Python versions: docker compose run --rm spark-tests
  spark-tests:
    profiles: ["test"]
    build:
      context: ./backend/spark
      target: test
    volumes:
      - ./backend/spark/jobs:/work/jobs
      - ./backend/spark/tests:/work/tests

  # ---------------------------------------------------------------- API
  backend:
    build: ./backend
    container_name: autoinsights_api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app # live code for --reload in development
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_DATABASE=${MONGO_DATABASE:-autoinsights}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - bigdata_net
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ---------------------------------------------------------------- dashboard
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: autoinsights_ui
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
    depends_on:
      - backend
    networks:
      - bigdata_net

  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: /api
    container_name: autoinsights_ui_prod
    ports:
      - "127.0.0.1:4173:80"
    depends_on:
      - backend
    networks:
      - bigdata_net

volumes:
  mongo_data:

networks:
  bigdata_net:
    driver: bridge
