# Local stack: a Spark cluster (1 master + 2 workers) that writes the gold tables, the API that
# serves them with DuckDB, and the dashboard. Gold tables live in backend/data/gold (git-ignored).
#
#   docker compose up -d --build                  # development (Vite dev server on :5173)
#   docker compose --profile prod up -d --build   # adds the production build on :4173
#   docker compose run --rm spark-tests           # ETL tests inside the Spark image
#   bash infra/check.sh                           # Terraform checks (terraform, tflint, trivy)
#   docker compose --profile lambda up -d         # the Lambda package in the Lambda runtime (:9000)
#
# Ports are bound to 127.0.0.1 so nothing is exposed to the local network.
# Optional overrides go in .env (see .env.example).

services:
  # ---------------------------------------------------------------- processing
  spark-master:
    build:
      context: ./backend/spark
      target: runtime
    container_name: spark-master
    ports:
      - "127.0.0.1:8080:8080" # master web UI
      - "127.0.0.1:7077:7077" # cluster port
    volumes:
      - ./backend/data:/opt/spark/data
      - ./backend/spark/jobs:/app # ETL code: etl_job.py, transforms.py, normalize.py
    networks:
      - bigdata_net
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker-1:
    build:
      context: ./backend/spark
      target: runtime
    container_name: spark-worker-1
    environment:
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./backend/data:/opt/spark/data
    depends_on:
      - spark-master
    networks:
      - bigdata_net
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  spark-worker-2:
    build:
      context: ./backend/spark
      target: runtime
    container_name: spark-worker-2
    environment:
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    ports:
      - "127.0.0.1:8082:8081"
    volumes:
      - ./backend/data:/opt/spark/data
    depends_on:
      - spark-master
    networks:
      - bigdata_net
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  # ETL tests on the same Spark and Python versions: docker compose run --rm spark-tests
  spark-tests:
    profiles: ["test"]
    build:
      context: ./backend/spark
      target: test
    volumes:
      - ./backend/spark/jobs:/work/jobs
      - ./backend/spark/tests:/work/tests

  # ---------------------------------------------------------------- API
  backend:
    build: ./backend
    container_name: autoinsights_api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app # live code for --reload in development
    environment:
      - GOLD_PATH=/app/data/gold
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}
      # "Ask the data": keys come from .env (git-ignored); without them the offline demo answers
      - LLM_PROVIDER=${LLM_PROVIDER:-fallback}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
    networks:
      - bigdata_net
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # The built Lambda package (python -m serverless.build in backend/) in the official Lambda
  # runtime image, arm64 like the deployed function. Smoke test: python -m serverless.smoke
  lambda-api:
    profiles: ["lambda"]
    image: public.ecr.aws/lambda/python:3.13-arm64@sha256:94dbd92894b891ab993ca3ddb1f4bc6eed61e277674ade3161766e4e16396415
    platform: linux/arm64
    container_name: autoinsights_lambda
    ports:
      - "127.0.0.1:9000:8080" # Runtime Interface Emulator invoke endpoint
    volumes:
      - ./backend/build/lambda/package:/var/task:ro
    environment: # the same settings Terraform gives the function (no API keys: offline demo)
      - AWS_LAMBDA_FUNCTION_MEMORY_SIZE=1024
      # 15 s in the cloud; arm64 is emulated here (qemu), so the cold start takes ~20 s
      # instead of ~1 s natively
      - AWS_LAMBDA_FUNCTION_TIMEOUT=300
      - HOME=/tmp
      - CORS_ORIGINS=
      - CLIENT_IP_HEADER=cloudfront-viewer-address
      - LLM_PROVIDER=fallback
    command: ["lambda_handler.handler"]

  # ---------------------------------------------------------------- dashboard
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: autoinsights_ui
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
    depends_on:
      - backend
    networks:
      - bigdata_net

  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: /api
    container_name: autoinsights_ui_prod
    ports:
      - "127.0.0.1:4173:80"
    depends_on:
      - backend
    networks:
      - bigdata_net

  # ---------------------------------------------------------------- infrastructure checks
  # Pinned by digest, no AWS credentials passed in: bash infra/check.sh runs all of them
  terraform:
    profiles: ["infra"]
    image: hashicorp/terraform:1.17.1@sha256:a5d5a5a892c98f60fcbfa81eac2a40fc19e7b3fa7719bccae10ff6111d22524a
    working_dir: /infra
    environment:
      - TF_IN_AUTOMATION=1
      - TF_INPUT=0
      - TF_PLUGIN_CACHE_DIR=/cache/terraform
    volumes:
      - ./infra:/infra
      - infra-cache:/cache

  tflint:
    profiles: ["infra"]
    image: ghcr.io/terraform-linters/tflint:v0.65.0@sha256:2788f4d4fc663c0e953b011b01bf443fe5bfce7587ee916e588e6057b85d6359
    working_dir: /infra
    environment:
      - TFLINT_PLUGIN_DIR=/cache/tflint
      - GITHUB_TOKEN=${GITHUB_TOKEN:-} # optional, avoids GitHub rate limits on plugin download
    volumes:
      - ./infra:/infra
      - infra-cache:/cache

  trivy:
    profiles: ["infra"]
    image: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    environment:
      - TRIVY_CACHE_DIR=/cache/trivy
    volumes:
      - ./infra:/infra:ro
      - infra-cache:/cache

networks:
  bigdata_net:
    driver: bridge

volumes:
  infra-cache:
