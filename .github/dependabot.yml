# Weekly dependency updates. Minor and patch bumps are grouped per ecosystem to keep PRs few.
# While v2 is in progress, updates target the working branch instead of main.
version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    target-branch: release/v2-cloud-platform
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: release/v2-cloud-platform
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: release/v2-cloud-platform
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /backend/spark]
    target-branch: release/v2-cloud-platform
    schedule:
      interval: weekly
    ignore:
      # Spark major/minor versions must match the MongoDB connector (mongo-spark-connector_2.12:3.0.1)
      - dependency-name: apache/spark
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    target-branch: release/v2-cloud-platform
    schedule:
      interval: weekly
    ignore:
      - dependency-name: mongo
        update-types: [version-update:semver-major]
