# Tool configuration for the backend. Dependencies are pinned in requirements*.txt.

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
# Flat modules of the API (.) and of the Spark ETL (spark/jobs)
known-first-party = [
    "config", "database", "main", "services",
    "etl_job", "normalize", "transforms",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with calls in defaults by design
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "notebooks/*"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
